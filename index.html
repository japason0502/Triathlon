<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="じゃぱトラ(じゃぱそんのトライアスロンブログ)" />
    <title>じゃぱ✕トライアスロン | ホーム</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/home.css" />
  </head>
  <body class="layout-home">

    <!-- Floating header nav -->
    <header class="site-header">
      <a class="site-header-brand" href="index.html">TRIATHLON</a>
      <nav class="site-nav" aria-label="サイト内">
        <a href="index.html" aria-current="page">ホーム</a>
        <a href="schedule.html">スケジュール</a>
        <a href="blog/">ブログ</a>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
      <img
        class="hero-bg"
        src="assets/img/hero.jpg"
        alt="九十九里トライアスロン フィニッシュ"
        fetchpriority="high"
        decoding="async"
        width="1600"
        height="1067"
      />
      <div class="hero-overlay">
        <p class="hero-eyebrow">湘南エリア</p>
        <h1 class="hero-title">Triathlon</h1>
        <p class="hero-sub">練習会スケジュール &amp; レース記録</p>
        <div class="hero-btns">
          <a class="hero-btn hero-btn-primary" href="schedule.html">練習会スケジュール</a>
          <a class="hero-btn hero-btn-ghost" href="blog/">ブログを読む</a>
        </div>
      </div>
    </section>

    <!-- 3 Disciplines -->
    <div class="disciplines" aria-hidden="true">
      <div class="discipline">
        <img src="assets/img/swim.jpg" alt="スイム" loading="lazy" width="600" height="400" />
        <div class="discipline-label"><span>01</span>スイム</div>
      </div>
      <div class="discipline">
        <img class="img-focus-center" src="assets/img/bike.jpg" alt="バイク" loading="lazy" width="600" height="400" />
        <div class="discipline-label"><span>02</span>バイク</div>
      </div>
      <div class="discipline">
        <img src="assets/img/run.jpg" alt="ラン" loading="lazy" width="600" height="400" />
        <div class="discipline-label"><span>03</span>ラン</div>
      </div>
    </div>

    <!-- Main content -->
    <main>
      <div class="page-wrap">

        <p class="section-title">About</p>
        <p class="about-text">
          じゃぱそんのトライアスロンブログです。トライアスリートにしか伝わらなそうな､すさまじくニッチな話しを中心に書いていきます。
        </p>

        <p class="section-title">Contents</p>
        <div class="landing-cards">
          <a class="landing-card" href="schedule.html">
            <div class="card-accent card-accent-blue"></div>
            <div class="card-body">
              <div class="card-icon">📅</div>
              <h2>練習会スケジュール</h2>
              <p>今後の練習会・イベントと直近の過去分。週1更新です。</p>
              <span class="card-go">見る →</span>
            </div>
          </a>
          <a class="landing-card" href="blog/">
            <div class="card-accent card-accent-teal"></div>
            <div class="card-body">
              <div class="card-icon">📝</div>
              <h2>ブログ</h2>
              <p>参加記録、ギアのメモ、チェックリストなど。</p>
              <span class="card-go">見る →</span>
            </div>
          </a>
        </div>

        <section class="home-blog" aria-labelledby="home-blog-heading">
          <div class="home-blog-header">
            <h2 id="home-blog-heading">最近のブログ</h2>
            <p class="more-link"><a href="blog/">すべての記事 →</a></p>
          </div>
          <div id="home-blog-list" class="post-list"></div>
        </section>

      </div>
    </main>

    <footer class="site-footer">
      <p>
        <a href="https://github.com/japason0502/Triathlon">GitHub</a>
      </p>
    </footer>

    <script src="assets/js/blog-list.js"></script>
    <script>
      renderBlogList("#home-blog-list", { manifestUrl: "blog/posts.json", linkPrefix: "blog/" });
    </script>
  </body>
</html>
